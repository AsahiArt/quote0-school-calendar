name: Deploy GitHub Pages

on:
  schedule:
    # 00:05 Asia/Shanghai. GitHub schedules run in UTC.
    - cron: "5 16 * * *"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/**"
      - "lib/**"
      - "public/**"
      - "scripts/build-pages.mjs"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test:unit
      - name: Build static landing page
        run: bun run build:pages
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.QUOTE0_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
